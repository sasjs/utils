# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: SASjs Utils Run Tests on Windows

on:
  pull_request:
  push:
    branches:
      - main

# read-only by default. Without this block the workflow inherits the repository
# default, which is write-all - the scorecard's Token-Permissions check deducts
# for exactly that, and this job only reads the repository and runs the suite.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Style
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Package
        run: npm run package:lib
        env:
          CI: true
