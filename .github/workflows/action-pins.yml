# Fails a pull request - and a push to the default branch - when an action this
# repository uses is not pinned to a commit, or is pinned to one that does not exist.
#
# The check itself is .github/actions/action-pins. It is a composite action so that
# every sasjs repository calls the same implementation and the same 27-case suite,
# rather than holding a copy that drifts.
name: Action pins

on:
  pull_request:
  # a direct push can add an unpinned action, and the next scorecard run is the only
  # thing that would notice
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    # the checker retries a rate-limited or 5xx lookup (5s then 10s per ref, or the
    # Retry-After the API asks for, capped at 30s), so the job has to outlast its own
    # retry budget rather than being killed midway
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every action is pinned to a commit, and that commit exists
        uses: ./.github/actions/action-pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
