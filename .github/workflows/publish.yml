name: SASjs Build and Publish

# Publishes the version the release names, and only that.
#
# This file is the one npm's trusted publisher is registered against, because the
# registry validates the workflow that actually runs `npm publish` (the OIDC
# `job_workflow_ref` claim) - not the workflow that triggered it. Keeping the tag
# in release.yml means neither job holds the other's permission: the release job
# never sees id-token, and this job never sees contents: write.
#
# A `release: published` trigger would not work and would fail silently: a release
# created with the pipeline's own GITHUB_TOKEN fires no events, because GitHub
# suppresses them to stop recursion. workflow_run is not suppressed, so publishing
# is chained off the Release workflow finishing.
#
# Nothing is committed. The tag is the version; it is stamped into the working
# tree because npm reads package.json, and the tree is thrown away. Which version,
# whether it may be published, and whether the registry already serves it are
# answered by `@sasjs/release --prepare-publish`, not by a shell block here: that
# logic was copied into each repository and each copy drifted.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  # a publish that failed can be retried: the release event fires once, and
  # re-creating the release to republish is exactly the state to avoid
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to publish. Required when dispatched; when this runs from
          the Release workflow, leave it blank and the tag that run created is
          used. Must be on main.
        required: false
        default: ''
      republish:
        description: Publish even when the registry already serves this version
        required: false
        type: boolean
        default: false

# read-only by default; this job asks only for the identity it publishes with
permissions:
  contents: read
  id-token: write # trusted publishing: the OIDC token is the credential

# one publish at a time: a dispatched retry must not interleave with a run that
# the Release workflow started
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # a fork must not publish one of the org's packages, and a release run that
    # failed has nothing to publish
    if: |
      github.repository == 'sasjs/utils' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always main: a dispatch can name any ref, and the tag gate inside
          # --prepare-publish treats main as the branch a release must be on.
          # Publishing is from main or not at all, so the checkout says so rather
          # than inheriting the dispatcher's choice.
          ref: main
          # the tag is how this workflow learns what to publish: the release run
          # created it at the commit it released
          fetch-depth: 0
          persist-credentials: false

      # Install the lockfile-pinned tool from trusted main, before checking
      # out historical source. Keep its exact bytes for both decisions.
      - name: Use Node.js for discovery
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org

      - name: Install trusted release tool
        run: |
          npm ci --ignore-scripts
          cp node_modules/@sasjs/release/release.mjs "$RUNNER_TEMP/sasjs-release.mjs"

      - name: Which tag is this run for?
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ]; then
            if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::invalid or missing workflow run SHA"
              exit 1
            fi
            args=(--sha "$SHA")
          else
            if [ -z "$REQUESTED" ]; then
              echo "::error::no tag - dispatch this with the tag to publish"
              exit 1
            fi
            args=(--tag "$REQUESTED")
          fi
          node "$RUNNER_TEMP/sasjs-release.mjs" --discover-publish --branch main --output "$GITHUB_OUTPUT" "${args[@]}"
          # npm strips SemVer build metadata, so it cannot publish that tag exactly.
          if grep -Eq '^version=.*\+' "$GITHUB_OUTPUT"; then
            echo "::error::npm cannot preserve build metadata in a release version"
            exit 1
          fi

      - name: Check out the tag
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git checkout -q "refs/tags/$TAG"

      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x - OIDC trusted publishing needs npm >= 11.5.1
      - name: Update npm
        if: steps.tag.outputs.tag != ''
        run: npm install -g npm@latest

      - name: Restore npm cache
        if: steps.tag.outputs.tag != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        if: steps.tag.outputs.tag != ''
        run: npm ci

      # Use the same lockfile-pinned tool copied from trusted main, not the
      # potentially older implementation installed by the tag's npm ci.
      #
      # It refuses a tag that is not an ancestor of main, stamps the tag's version
      # into package.json (npm reads the file, the tree is thrown away), and reports
      # `publish=false` when the registry already serves that version - which is a
      # re-run of a finished release, not a failure.
      - name: Stamp the version, and ask whether it is published
        id: publish
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${REPUBLISH:-false}" = "true" ]; then extra+=(--republish); fi
          node "$RUNNER_TEMP/sasjs-release.mjs" --prepare-publish --tag "$TAG" --branch main ${extra[@]+"${extra[@]}"} --output "$GITHUB_OUTPUT"

      - name: Check code style
        if: steps.publish.outputs.publish == 'true'
        run: npm run lint

      - name: Build Project
        if: steps.publish.outputs.publish == 'true'
        run: npm run build

      - name: Clean up ready for publishing
        if: steps.publish.outputs.publish == 'true'
        run: npm run publishInit

      - name: Publish to npm with trusted publisher
        if: steps.publish.outputs.publish == 'true'
        # no NODE_AUTH_TOKEN: the OIDC token is exchanged for a short-lived
        # credential, so there is no long-lived secret in this repository.
        # --ignore-scripts=false re-enables this package's own prepublishOnly,
        # which .npmrc disables for every other command; nothing is installed at
        # publish time, so no dependency's script can run from it.
        run: npm publish --access public --ignore-scripts=false
